{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Pet List</h1>

    {% if user.is_staff %}
      <a href="{% url 'catalog:pet-create' %}" class="btn btn-primary">
        <i class="fa-solid fa-plus me-1"></i> Add New Pet
      </a>
    {% endif %}
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for pet in pet_list %}
      <div class="col">
        <div class="card h-100 shadow-sm border-0">
          {% if pet.image %}
            <img src="{{ pet.image.url }}" class="card-img-top" alt="{{ pet.name }}" style="height: 220px; object-fit: cover;">
          {% else %}
            <img src="{% static 'images/default-pet.png' %}" class="card-img-top" alt="Default Image" style="height: 220px; object-fit: cover;">
          {% endif %}
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ pet.name }}</h5>
            <p class="text-muted">{{ pet.breed.name }}</p>
            <a href="{% url 'catalog:pet-detail' pk=pet.pk %}" class="btn btn-outline-primary btn-sm">View details</a>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="col-12">
        <p class="text-muted">No pets found.</p>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
